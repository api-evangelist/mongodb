    for MongoDB Cloud to connect to your LDAP server over TLS for user authentication and authorization.
    Your LDAP server must be visible to the internet or connected to your MongoDB Cloud cluster with VPC
    Peering. Also, your LDAP server must use TLS. You must have the MongoDB Cloud admin user privilege
    to use these endpoints. Also, to configure user authentication and authorization with LDAPS, your
    cluster must run MongoDB 3.6 or higher. Groups for which you have configured LDAPS can't create a
