- aid: mongodb:mongodb-aws-clusters-dns-api
  name: MongoDB AWS Clusters DNS API
  description: >-
    Returns and edits custom DNS configurations for MongoDB Cloud database deployments on AWS. The resource
    requires your Project ID. If you use the VPC peering on AWS and you use your own DNS servers instead
    of Amazon Route 53, enable custom DNS. Before 31 March 2020, applications deployed within AWS using
    custom DNS services and VPC-peered with MongoDB Cloud couldn't connect over private IP addresses.
    Custom DNS resolved to public IP addresses. AWS internal DNS resolved to private IP addresses. Applications
    deployed with custom DNS services in AWS should use Private IP for Peering connection strings.
