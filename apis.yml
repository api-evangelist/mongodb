- aid: mongodb:mongodb-x-509-authentication-api
  name: MongoDB X.509 Authentication API
  description: >-
    Returns, edits, and removes user-managed X.509 configurations. Also returns and generates MongoDB
    Cloud-managed X.509 certificates for database users. The following resources help manage database
    users who authenticate using X.509 certificates. You can manage these X.509 certificates or let MongoDB
    Cloud do it for you. If MongoDB Cloud manages your certificates, it also manages your Certificate
    Authority and can generate certificates for your database users. No additional X.509 configuration
    is required. If you manage your certificates, you must provide a Certificate Authority and generate
    certificates for your database users.
  humanURL: https://www.mongodb.com/docs/atlas/api/
  baseURL: https://cloud.mongodb.com/api/atlas/v2
