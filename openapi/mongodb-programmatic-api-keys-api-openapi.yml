  title: MongoDB Atlas Administration Access Tracking Programmatic API Keys API
  version: '2.0'
  x-xgen-sha: 3d70e065843c008b9871ea7836c98c9de6f202f9
servers:
- url: https://cloud.mongodb.com
security:
