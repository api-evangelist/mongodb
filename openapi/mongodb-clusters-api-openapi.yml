            - ASIA_EAST_2
            - ASIA_NORTHEAST_2
            - ASIA_NORTHEAST_3
            - ASIA_SOUTH_1
            - ASIA_SOUTH_2
            - ASIA_SOUTHEAST_2
            externalDocs:
              description: GCP
              url: https://docs.atlas.mongodb.com/reference/google-gcp/
            title: GCP Regions
            type: string
        type: object
      type: object
    ClusterDescriptionAutoScalingModeConfiguration:
      description: Contains the internal configuration of AutoScaling on sharded clusters.
      properties:
