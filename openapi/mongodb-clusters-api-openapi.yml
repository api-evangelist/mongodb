          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
          type: array
      required:
      - expirationTime
      - grantType
      type: object
    ClusterCloudProviderInstanceSize:
      properties:
        availableRegions:
          description: List of regions that this cloud provider supports for this instance size.
