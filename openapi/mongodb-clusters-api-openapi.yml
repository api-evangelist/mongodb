          description: Describes whether cluster nodes scale together across all shards or independently.
          enum:
          - INDEPENDENT_SHARD_SCALING
          - CLUSTER_WIDE_SCALING
          type: string
      title: Internal configuration of AutoScaling on sharded clusters
      type: object
    PaginatedClusterDescription20240805:
      properties:
        links:
          description: List of one or more Uniform Resource Locators (URLs) that point to API sub-resources, related API resources, or both. RFC 5988 outlines these relationships.
          externalDocs:
            description: Web Linking Specification (RFC 5988)
