          type: string
        analyzers:
          description: List of user-defined methods to convert database field text into searchable words.
          externalDocs:
            description: Custom Atlas Search Analyzers
            url: https://dochub.mongodb.org/core/custom-fts
          items:
            $ref: '#/components/schemas/AtlasSearchAnalyzer'
          type: array
        mappings:
          $ref: '#/components/schemas/SearchMappings'
        numPartitions:
          default: 1
          description: Number of index partitions. Allowed values are [1, 2, 4].
          format: int32
          type: integer
        searchAnalyzer:
          default: lucene.standard
          description: Method applied to identify words when searching this index.
          enum:
          - lucene.standard
          - lucene.simple
          - lucene.whitespace
          - lucene.keyword
          - lucene.arabic
          - lucene.armenian
          - lucene.basque
          - lucene.bengali
          - lucene.brazilian
          - lucene.bulgarian
          - lucene.catalan
          - lucene.chinese
          - lucene.cjk
          - lucene.czech
          - lucene.danish
          - lucene.dutch
          - lucene.english
          - lucene.finnish
          - lucene.french
          - lucene.galician
          - lucene.german
          - lucene.greek
          - lucene.hindi
          - lucene.hungarian
          - lucene.indonesian
          - lucene.irish
          - lucene.italian
          - lucene.japanese
          - lucene.korean
          - lucene.kuromoji
          - lucene.latvian
          - lucene.lithuanian
          - lucene.morfologik
          - lucene.nori
          - lucene.norwegian
          - lucene.persian
          - lucene.portuguese
          - lucene.romanian
          - lucene.russian
          - lucene.smartcn
          - lucene.sorani
          - lucene.spanish
          - lucene.swedish
          - lucene.thai
          - lucene.turkish
          - lucene.ukrainian
          type: string
        sort:
          description: 'Sort definition for the index. When defined, the index will be pre-sorted on the specified fields, which improves query sort performance for those fields. Supports two formats: simple format with field name and direction, or complex format with additional options. The `order` field is required (1=ascending, -1=descending).The `noData` field is optional and controls how missing values are sorted(default: "lowest").'
          example:
            anotherField:
              noData: highest
              order: -1
            fieldName: 1
          type: object
        storedSource:
          description: Flag that indicates whether to store all fields (true) on Atlas Search. By default, Atlas doesn't store (false) the fields on Atlas Search.  Alternatively, you can specify an object that only contains the list of fields to store (include) or not store (exclude) on Atlas Search. Note that storing all fields (true) is not allowed for vector search indexes. To learn more, see Stored Source Fields.
          example:
            include | exclude:
            - field1
            - field2
          externalDocs:
            description: Stored Source Fields
            url: https://dochub.mongodb.org/core/atlas-search-stored-source
          type: object
        synonyms:
          description: Rule sets that map words to their synonyms in this index.
          externalDocs:
            description: Synonym Mapping
            url: https://dochub.mongodb.org/core/fts-synonym-mappings
          items:
            $ref: '#/components/schemas/SearchSynonymMappingDefinition'
          type: array
        typeSets:
          description: Type sets for the index.
          items:
            $ref: '#/components/schemas/SearchTypeSets'
          maxItems: 100
          type: array
      required:
      - mappings
      title: Text Search Index Definition
      type: object
    SearchIndexDefinitionVersion:
      description: Object which includes the version number of the index definition and the time that the index definition was created.
      properties:
        createdAt:
          description: The time at which this index definition was created. This parameter expresses its value in the ISO 8601 timestamp format in UTC.
          format: date-time
          type: string
        version:
          description: The version number associated with this index definition when it was created.
          format: int64
          type: integer
      title: Search Index Definition Version
      type: object
    SynonymSource:
      description: Data set that stores words and their applicable synonyms.
      properties:
        collection:
          description: Label that identifies the MongoDB collection that stores words and their applicable synonyms.
          type: string
      required:
      - collection
      type: object
    SearchTypeSets:
      description: Type sets for an Atlas Search index definition.
      externalDocs:
        description: Type Sets
        url: https://dochub.mongodb.org/core/atlas-search-configure-dynamic-indexing
      properties:
        name:
          description: Label that identifies the type set name. Each `typeSets.name` must be unique within the same index definition.
          type: string
        types:
          description: List of types associated with the type set. Each type definition must include a `type` field specifying the search field type (`autocomplete`, `boolean`, `date`, `geo`, `number`, `objectId`, `string`, `token`, or `uuid`) and may include additional configuration properties specific to that type.
          items:
            $ref: '#/components/schemas/BasicDBObject'
          maxItems: 100
          type: array
      required:
      - name
      - types
      title: TypeSets
      type: object
    Fields:
      externalDocs:
        description: Atlas Search Field Mappings
        url: https://dochub.mongodb.org/core/field-mapping-definition-fts#define-field-mappings
      type: object
    SearchIndexResponse:
      discriminator:
        mapping:
          search: '#/components/schemas/TextSearchIndexResponse'
          vectorSearch: '#/components/schemas/VectorSearchIndexResponse'
        propertyName: type
      properties:
        collectionName:
          description: Label that identifies the collection that contains one or more Atlas Search indexes.
          type: string
        database:
          description: Label that identifies the database that contains the collection with one or more Atlas Search indexes.
          type: string
        indexID:
          description: Unique 24-hexadecimal digit string that identifies this Atlas Search index.
          example: 32b6e34b3d91647abb20e7b8
          pattern: ^([a-f0-9]{24})$
          type: string
        latestDefinition:
          $ref: '#/components/schemas/SearchIndexDefinition'
        latestDefinitionVersion:
          $ref: '#/components/schemas/SearchIndexDefinitionVersion'
        name:
          description: Label that identifies this index. Within each namespace, the names of all indexes must be unique.
          type: string
        queryable:
          description: Flag that indicates whether the index is queryable on all hosts.
          type: boolean
        status:
          description: 'Condition of the search index when you made this request.


            - `DELETING`: The index is being deleted.

            - `FAILED` The index build failed. Indexes can enter the FAILED state due to an invalid index definition.

            - `STALE`: The index is queryable but has stopped replicating data from the indexed collection. Searches on the index may return out-of-date data.

            - `PENDING`: Atlas has not yet started building the index.

            - `BUILDING`: Atlas is building or re-building the index after an edit.

            - `READY`: The index is ready and can support queries.'
          enum:
          - DELETING
          - FAILED
          - STALE
          - PENDING
          - BUILDING
          - READY
          - DOES_NOT_EXIST
          type: string
        statusDetail:
          description: List of documents detailing index status on each host.
          items:
            $ref: '#/components/schemas/SearchHostStatusDetail'
          type: array
        type:
          description: Type of the index. The default type is search.
          enum:
          - search
          - vectorSearch
          type: string
      title: Search Index Response
      type: object
  parameters:
    envelope:
      description: Flag that indicates whether Application wraps the response in an `envelope` JSON object. Some API clients cannot access the HTTP response headers or status code. To remediate this, set envelope=true in the query. Endpoints that return a list of results use the results object as an envelope. Application adds the status parameter to the response body.
      in: query
      name: envelope
      schema:
        default: false
        type: boolean
    groupId:
      description: 'Unique 24-hexadecimal digit string that identifies your project. Use the [/groups](#tag/Projects/operation/listProjects) endpoint to retrieve all projects to which the authenticated user has access.


        **NOTE**: Groups and projects are synonymous terms. Your group id is the same as your project id. For existing groups, your group/project id remains the same. The resource and corresponding endpoints use the term groups.'
      in: path
      name: groupId
      required: true
      schema:
        example: 32b6e34b3d91647abb20e7b8
        pattern: ^([a-f0-9]{24})$
        type: string
    pretty:
      description: Flag that indicates whether the response body should be in the prettyprint format.
      in: query
      name: pretty
      schema:
        default: false
        externalDocs:
          description: Prettyprint
          url: https://en.wikipedia.org/wiki/Prettyprint
        type: boolean
  headers:
    HeaderRetryAfter:
      description: The minimum time you should wait, in seconds, before retrying the API request. This header might be returned for 429 or 503 error responses.
      schema:
        type: integer
    HeaderRateLimitLimit:
      description: The maximum number of requests that a user can make within a specific time window.
      schema:
        type: integer
    HeaderRateLimitRemaining:
      description: The number of requests remaining in the current rate limit window before the limit is reached.
      schema:
        type: integer
  securitySchemes:
    DigestAuth:
      scheme: digest
      type: http
    ServiceAccounts:
      description: Learn more about [Service Accounts](https://www.mongodb.com/docs/atlas/api/service-accounts-overview).
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://cloud.mongodb.com/api/oauth/token
      type: oauth2
