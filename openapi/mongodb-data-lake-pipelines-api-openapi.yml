          example: 32b6e34b3d91647abb20e7b8
          pattern: ^([a-f0-9]{24})$
          readOnly: true
          type: string
        state:
          description: State of the pipeline run.
          enum:
          - PENDING
          - IN_PROGRESS
          - DONE
          - FAILED
          - DATASET_DELETED
          readOnly: true
          type: string
        stats:
          $ref: '#/components/schemas/PipelineRunStats'
