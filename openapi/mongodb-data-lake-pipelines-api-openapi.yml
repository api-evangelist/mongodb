          format: date-time
          readOnly: true
          type: string
        datasetName:
          description: Human-readable label that identifies the dataset that Atlas generates during this pipeline run. You can use this dataset as a `dataSource` in a Federated Database collection.
          example: v1$atlas$snapshot$Cluster0$myDatabase$myCollection$19700101T000000Z
          readOnly: true
          type: string
        datasetRetentionPolicy:
          $ref: '#/components/schemas/DatasetRetentionPolicy'
        groupId:
          description: Unique 24-hexadecimal character string that identifies the project.
          example: 32b6e34b3d91647abb20e7b8
          pattern: ^([a-f0-9]{24})$
          readOnly: true
          type: string
        lastUpdatedDate:
          description: Timestamp that indicates the last time that the pipeline run was updated. This parameter expresses its value in the ISO 8601 timestamp format in UTC.
          format: date-time
          readOnly: true
          type: string
        phase:
          description: Processing phase of the Data Lake Pipeline.
          enum:
          - SNAPSHOT
          - EXPORT
          - INGESTION
          readOnly: true
          type: string
        pipelineId:
          description: Unique 24-hexadecimal character string that identifies a Data Lake Pipeline.
          example: 32b6e34b3d91647abb20e7b8
          pattern: ^([a-f0-9]{24})$
          readOnly: true
          type: string
