    DatasetRetentionPolicy:
      description: Dataset Retention Policy for a Scheduled Data Lake Pipeline.
      properties:
        lastModifiedDate:
          description: Date when retention policy was last modified. This parameter expresses its value in the ISO 8601 timestamp format in UTC.
          format: date-time
          readOnly: true
          type: string
        units:
          description: Quantity of time in which the Data Lake Pipeline measures dataset retention.
          enum:
          - DAYS
          - WEEKS
          - MONTHS
