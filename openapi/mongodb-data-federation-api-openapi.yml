        name: type
        schema:
          default: USER
          enum:
          - USER
          - ONLINE_ARCHIVE
          type: string
      responses:
        '200':
          content:
            application/vnd.atlas.2023-01-01+json:
              schema:
                items:
                  $ref: '#/components/schemas/DataLakeTenant'
                type: array
