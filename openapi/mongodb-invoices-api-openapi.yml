      x-rolesRequirements:
      - Organization Billing Viewer
      x-xgen-docs-url: https://mongodb.com/docs/atlas/reference/api-resources-spec/v2/#tag/Invoices/operation/listOrgInvoices
      x-xgen-operation-id-override: listInvoices
