            - Support
            - Credits
            type: string
          type: array
          uniqueItems: true
        usageEndDate:
          description: The inclusive billing start date for usage details filter.
          format: date
          type: string
        usageStartDate:
          description: The inclusive usage start date for usage details filter.
          format: date
          type: string
      type: object
    CostExplorerFilterRequestBody:
      description: Request body for a cost explorer query.
      properties:
        clusters:
          description: The list of clusters to be included in the Cost Explorer Query.
          items:
            example: 32b6e34b3d91647abb20e7b8
