          format: double
          type: number
        command:
          description: The MongoDB command issued for this query shape.
          enum:
          - find
          - distinct
          - aggregate
          type: string
        cpuTime:
          description: Total CPU time in nanoseconds consumed by queries with the given query shape. Available for MDB 8.2 and higher.
          format: double
          nullable: true
          type: number
        docsExamined:
          description: Total number of documents examined by queries with the given query shape.
          format: double
          type: number
        docsExaminedRatio:
          description: Ratio of documents examined to documents returned by queries with the given query shape.
          format: double
          type: number
        docsReturned:
          description: Total number of documents returned by queries with the given query shape.
          format: double
          type: number
        execCount:
          description: Total number of times that queries with the given query shape have been executed.
          format: double
          type: number
        keysExamined:
          description: Total number of in-bounds and out-of-bounds index keys examined by queries with the given query shape.
          format: double
          type: number
        keysExaminedRatio:
          description: Ratio of in-bounds and out-of-bounds index keys examined to indexes containing documents returned by queries with the given query shape.
          format: double
          type: number
        lastExecMicros:
          description: Execution runtime in microseconds for the most recent query with the given query shape.
          format: double
          type: number
        namespace:
          description: Human-readable label that identifies the namespace on the specified host. The resource expresses this parameter value as `<database>.<collection>`.
          type: string
        p50ExecMicros:
          description: The 50th percentile value of execution time in microseconds.
          format: double
          type: number
        p90ExecMicros:
          description: The 90th percentile value of execution time in microseconds.
          format: double
          type: number
        p99ExecMicros:
          description: The 99th percentile value of execution time in microseconds.
          format: double
          type: number
        queryShape:
          description: A query shape is a set of specifications that group similar queries together. Specifications can include filters, sorts, projections, aggregation pipeline stages, a namespace, and others. Queries that have similar specifications have the same query shape.
          type: string
        queryShapeHash:
          description: A hexadecimal string that represents the hash of a MongoDB query shape.
          type: string
        systemQuery:
          description: Indicates whether this query shape represents a system-initiated query.
