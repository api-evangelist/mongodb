    QueryStatsSummary:
      description: A summary of execution statistics for a given query shape.
      properties:
        avgWorkingMillis:
          description: Average total time in milliseconds spent running queries with the given query shape. If the query resulted in `getMore` commands, this metric includes the time spent processing the `getMore` requests. This metric does not include time spent waiting for the client.
